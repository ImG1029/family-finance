spring:
  application:
    name: family-finance

    datasource:
      url: ${DB_URL:jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;CLOSE_ON_EXIT=FALSE}
      username: ${DB_USERNAME:sa}
      password: ${DB_PASSWORD:}
      driver-class-name: ${DB_DRIVER:org.h2.Driver}

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration