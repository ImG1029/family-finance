spring:
  application:
    name: family-finance

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/family_finance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION}
  refresh-token:
    expiration-days: ${REFRESH_EXPIRATION}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}