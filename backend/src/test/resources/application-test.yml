spring:
  application:
    name: family-finance

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

app:
  jwt:
    secret: "super-secret-dummy-key-for-testing-only-with-32-chars-min"
    expiration-ms: 300000
  refresh-token:
    expiration-days: 5
  cors:
    allowed-origins: "http://localhost:5173"